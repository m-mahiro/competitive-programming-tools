id: yukicoder
name: yukicoder

matches:
  - https://yukicoder.me/problems/*

routes:
  problem: '^/problems/'

navigationLists: []

submission:
  editor: codemirror
  editorElements: ['.cm-source-editor .cm-content']
  textarea: '#source'
  commentMount: '#toggle_source_editor'
  shortcut: ''
  submitButtons: ['#submit_form input[type="submit"]']
