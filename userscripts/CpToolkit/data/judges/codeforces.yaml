id: codeforces
name: Codeforces

matches:
  - https://codeforces.com/*
  - https://*.contest.codeforces.com/*
  - https://m1.codeforces.com/*
  - https://m2.codeforces.com/*
  - https://m3.codeforces.com/*

routes:
  page: '^/'
  problem: '^/(contest/[^/]+/problem|gym/[^/]+/problem|problemset/problem|group/[^/]+/contest/[^/]+/problem)/'

navigationLists: []

submission:
  editor: ace
  editorElements: ['#editor']
  textarea: '.submit-form textarea[name="source"], .submitForm textarea[name="source"], form._SubmitPage_submitForm textarea[name="source"], textarea[data-cp-easy-test-source]'
  taskSelect: '[name="submittedProblemIndex"], [name="problemIndex"]'
  shortcut: Ctrl+Shift+Enter
  submitButtons:
    - '.submit-form .submit'
    - '.submitForm .submit'
    - 'input[type="submit"].submit'
    - 'form._SubmitPage_submitForm button[type="submit"]'
