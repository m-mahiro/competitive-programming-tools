id: atcoder
name: AtCoder

# Tampermonkey の @match にそのまま出力する
matches:
  - https://atcoder.jp/*

# パスとクエリに対する正規表現
routes:
  page: '^/[^?]'  # トップページ以外
  home: '^/(\?|$)'
  contest: '^/contests/(?!archive)[^/?#]+'
  tasks: '^/contests/[^/]+/tasks/?(\?|$)'
  task: '^/contests/[^/]+/tasks/[^/?#]+'
  tasksPrint: '^/contests/[^/]+/tasks_print'
  tessokuTasks: '^/contests/tessoku-book/tasks/?(\?|$)'
  submit: '^/contests/[^/]+/submit'
  customTest: '^/contests/[^/]+/custom_test'
  submissions: '^/contests/[^/]+/submissions(/me)?/?(\?|$)'
  submissionDetail: '^/contests/[^/]+/submissions/\d+'
  editorial: '^/contests/[^/]+/(tasks/[^/?#]+/)?editorial/?(\?|$)'
  virtual: '^/contests/[^/]+/virtual/?(\?|$)'
  user: '^/users/[^/?#]+/?(\?(?!.*graph=(rank|dist)).*)?$'

# 設定画面へのリンクを追加するメニュー。ヘッダーの形が2種類あるため上から順に探す
navigationLists:
  - '#navbar-collapse .navbar-right'  # コンテストのページ
  - '#header .header-page'            # それ以外のページ

submission:
  editor: ace
  editorElements: ['#editor']
  textarea: '#plain-textarea'
  commentMount: '.editor-buttons'
  taskSelect: '#select-task'
  submitButtons: ['#submit']

# 一言語分の問題文を起点に、書式に合うセレクタまで順に試す
samples:
  - {selector: 'p+pre.literal-block', container: .section}
  - {selector: 'pre.source-code-for-copy', container: .part}
  - {selector: '.div-btn-copy+pre', container: .part}
  - {selector: ':scope>.part pre.linenums', container: .part}
  - {selector: ':scope>.part section>pre', container: .part}
  - {selector: ':scope>.part:not(.io-style)>h3+section>pre', container: .part}
  - {selector: 'pre', container: .part}
  # maximum_cup_2018_d はサンプルも .io-style の中にある
  - {selector: '.div-btn-copy+pre', container: .part, insideIoStyle: true}
